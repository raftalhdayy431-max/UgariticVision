name: Build Android APK

on:
workflow_dispatch:

push:
branches:
- main
- master

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

```
steps:

  # =========================
  # تحميل المشروع
  # =========================
  - name: Checkout
    uses: actions/checkout@v4


  # =========================
  # Java 17
  # =========================
  - name: Setup JDK 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle


  # =========================
  # Android SDK
  # =========================
  - name: Setup Android SDK
    uses: android-actions/setup-android@v3


  # =========================
  # تثبيت SDK المطلوب
  # =========================
  - name: Install Android SDK Packages
    run: |
      sdkmanager --install \
        "platforms;android-36" \
        "build-tools;36.0.0"


  # =========================
  # فحص هيكل المشروع
  # =========================
  - name: Check Project Structure
    working-directory: UgariticVision
    run: |
      echo "=== Current Directory ==="
      pwd

      echo "=== Project Files ==="
      ls -la

      echo "=== App Directory ==="
      ls -la app

      echo "=== Gradle Wrapper ==="
      ls -la gradlew


  # =========================
  # إعطاء صلاحية تنفيذ Gradle Wrapper
  # =========================
  - name: Make Gradle Wrapper Executable
    working-directory: UgariticVision
    run: chmod +x gradlew


  # =========================
  # عرض نسخة Gradle
  # =========================
  - name: Check Gradle Version
    working-directory: UgariticVision
    run: ./gradlew --version


  # =========================
  # تنظيف المشروع
  # =========================
  - name: Clean Project
    working-directory: UgariticVision
    run: ./gradlew clean --stacktrace


  # =========================
  # بناء APK
  # =========================
  - name: Build Debug APK
    working-directory: UgariticVision
    run: ./gradlew assembleDebug --stacktrace --no-daemon


  # =========================
  # التأكد من إنشاء APK
  # =========================
  - name: Verify APK
    working-directory: UgariticVision
    run: |
      echo "=== APK Files ==="
      find app/build/outputs -type f -name "*.apk" -print

      echo ""
      echo "=== Debug APK Details ==="

      ls -lh app/build/outputs/apk/debug/


  # =========================
  # حفظ APK كـ Artifact
  # =========================
  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: UgariticVision-debug-apk
      path: UgariticVision/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error


  # =========================
  # إنشاء GitHub Release
  # =========================
  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: "v1.0.${{ github.run_number }}"
      name: "UgariticVision v1.0.${{ github.run_number }}"
      body: |
        UgariticVision Android APK

        Build Number: ${{ github.run_number }}
        Commit: ${{ github.sha }}

        APK جاهز للتثبيت على Android.

      files: |
        UgariticVision/app/build/outputs/apk/debug/app-debug.apk

      draft: false
      prerelease: false

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
