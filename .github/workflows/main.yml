name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project structure
        working-directory: UgariticVision
        run: |
          echo "=== Project root ==="
          pwd
          echo "=== Project files ==="
          ls -la
          echo "=== App directory ==="
          ls -la app

      - name: Build Debug APK
        working-directory: UgariticVision
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        working-directory: UgariticVision
        run: |
          echo "=== APK files ==="
          find app/build/outputs -type f -name "*.apk" -print

      # نسخة احتياطية داخل Actions Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UgariticVision-debug-apk
          path: UgariticVision/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # إنشاء Release ورفع APK مباشرة
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "UgariticVision v1.0.${{ github.run_number }}"
          body: |
            UgariticVision Android APK

            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            APK جاهز للتثبيت على Android.
          files: |
            UgariticVision/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
